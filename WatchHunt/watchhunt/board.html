<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WatchHunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --dial:#17243a; --dial-2:#1f3050; --steel:#dfe4ea; --muted:#8e9bb0; --rule:#2c3d5c;
  --brass:#c2a466; --brass-soft:rgba(194,164,102,.28); --lume:#86cdbd; --oxblood:#c9634b;
  --figures:"Barlow Condensed","Arial Narrow",sans-serif; --text:"Barlow","Helvetica Neue",Arial,sans-serif;
  --wrap:1240px; --thumb:48px; --fig:20px; --base:15px;
  --cols:minmax(220px,2.2fr) 90px 92px 118px minmax(180px,1.6fr) 96px 92px;
}
@media (prefers-color-scheme: light){
  :root{--dial:#f1f2ee; --dial-2:#e4e7e2; --steel:#17243a; --muted:#5c6a80; --rule:#cfd4cc;
        --brass:#9a7a37; --brass-soft:rgba(154,122,55,.22); --lume:#2f8a76; --oxblood:#b24a33;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--dial);color:var(--steel);font:var(--base)/1.45 var(--text)}
body{background:radial-gradient(120% 80% at 50% -10%, var(--dial-2), var(--dial) 60%) fixed}
header{max-width:var(--wrap);margin:0 auto;padding:28px 20px 12px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;justify-content:space-between}
h1{font:600 44px/1 var(--figures);letter-spacing:.01em;margin:0}
.status{color:var(--muted);font-size:14px}
.status b{color:var(--steel);font-weight:500}
.controls{max-width:var(--wrap);margin:0 auto;padding:0 20px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.seg button,.btn{font:500 14px var(--text);color:var(--muted);background:none;border:0;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brass-soft);color:var(--steel)}
.btn{border:1px solid var(--rule);border-radius:999px;white-space:nowrap;text-decoration:none;display:inline-block}
.seg button{white-space:nowrap}
.ml{display:none}
.cnt{margin-left:6px;font-size:12px;opacity:.75}
.badge-new{display:inline-block;margin-right:6px;padding:0 6px;border-radius:999px;background:var(--lume);color:#0b1220;font-size:11px;font-weight:700;vertical-align:2px}
.star{background:none;border:0;padding:0 6px 0 0;font-size:18px;line-height:1;cursor:pointer;color:var(--muted)}
.star.on{color:var(--brass)}
.row.bidding{box-shadow:inset 3px 0 0 var(--brass)}
.btn:hover,.seg button:hover{color:var(--steel)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.spacer{flex:1}
.assume{max-width:var(--wrap);margin:0 auto;padding:0 20px 18px;color:var(--muted);font-size:13px}

main{max-width:var(--wrap);margin:0 auto;padding:0 20px 60px}
.head,.row>summary{display:grid;grid-template-columns:var(--cols);gap:14px;align-items:center}
.head{color:var(--muted);font-size:13px;padding:0 12px 8px;border-bottom:1px solid var(--rule)}
.head .num,.num{text-align:right}
.row{border-bottom:1px solid var(--rule)}
.row>summary{list-style:none;padding:12px;cursor:pointer}
.row>summary::-webkit-details-marker{display:none}
.row[open]>summary,.row>summary:hover{background:rgba(255,255,255,.03)}
.row.ended{opacity:.55}
.watch{display:flex;gap:12px;align-items:center;min-width:0}
.watch img{width:var(--thumb);height:var(--thumb);border-radius:50%;object-fit:cover;border:1px solid var(--rule);flex:none;background:var(--dial-2)}
.watch .t{min-width:0}
.watch .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig{font:500 var(--fig)/1.1 var(--figures);font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--muted)}
.pos{color:var(--lume)} .neg{color:var(--oxblood)}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--brass-soft)}100%{background:transparent}}
.concern{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* The gauge: brass band = value range, needle = your all-in cost */
.gauge{position:relative;height:34px}
.gauge .track{position:absolute;left:0;right:0;top:16px;height:2px;background:var(--rule)}
.gauge .ticks{position:absolute;left:0;right:0;top:11px;height:12px;
  background:repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 10%)}
.gauge .band{position:absolute;top:10px;height:14px;background:var(--brass-soft);border:1px solid var(--brass);border-radius:3px}
.gauge .band.ai{border-style:dashed}
.gauge .band.market{border-style:dotted}
.gauge .band.manual{border-style:dashed}
.risk{color:var(--oxblood)}
.steps{margin:4px 0 0;padding-left:20px}
.steps li{margin-bottom:3px}
.gauge .mid{position:absolute;top:8px;width:1px;height:18px;background:var(--brass)}
.gauge .needle{position:absolute;top:2px;width:2px;height:30px;border-radius:1px;transform:translateX(-1px)}
.gauge .needle::after{content:"";position:absolute;left:-3px;bottom:-2px;width:8px;height:8px;border-radius:50%;background:inherit}
.gauge .none{position:absolute;top:8px;font-size:12px;color:var(--muted)}

.detail{padding:4px 12px 18px calc(var(--thumb) + 24px);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 32px;color:var(--muted);font-size:14px}
.detail b{color:var(--steel);font-weight:500}
.detail ul{margin:4px 0 0;padding-left:18px}
.detail .actions{display:flex;gap:8px;align-items:start}
.empty{padding:48px 12px;color:var(--muted);max-width:60ch}
.empty code{color:var(--steel)}
.err{color:var(--oxblood);max-width:var(--wrap);margin:0 auto;padding:0 20px 10px}

@media (max-width:900px){
  .head{display:none}
  .row>summary{grid-template-columns:1fr auto;grid-template-areas:"w w" "p e" "g g" "n m";row-gap:8px}
  .ml{display:block}
  .controls .seg{max-width:100%;overflow-x:auto}
  .c-watch{grid-area:w}.c-price{grid-area:p;text-align:left}.c-ends{grid-area:e;text-align:right}
  .c-gauge{grid-area:g}.c-net{grid-area:n;text-align:left}.c-max{grid-area:m}
  .c-value{display:none}
  .detail{padding-left:12px}
  h1{font-size:36px}
}
/* Bigger monitors: use the width. The gauge and the watch name get most of the extra room. */
@media (min-width:1500px){
  :root{--wrap:1480px; --thumb:56px; --fig:22px; --base:16px;
        --cols:minmax(280px,2.4fr) 104px 104px 132px minmax(260px,2fr) 112px 104px}
  h1{font-size:52px}
    .gauge{height:38px}
}
@media (min-width:1900px){
  :root{--wrap:1840px; --thumb:64px; --fig:24px; --base:17px;
        --cols:minmax(340px,2.6fr) 116px 116px 148px minmax(360px,2.4fr) 124px 116px}
  h1{font-size:58px}
    .detail{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
}
@media (min-width:2500px){
  :root{--wrap:2360px; --thumb:72px; --fig:26px; --base:18px;
        --cols:minmax(420px,2.8fr) 130px 130px 164px minmax(480px,2.8fr) 140px 130px}
  h1{font-size:64px}
  }
@media (prefers-reduced-motion: reduce){.flash{animation:none}}
</style>
</head>
<body>
<header>
  <h1>WatchHunt</h1>
  <div class="status" id="status" aria-live="polite">Loading…</div>
</header>
<div class="err" id="err" hidden></div>
<div class="controls">
  <div class="seg" role="group" aria-label="Filter">
    <button data-f="all" aria-pressed="true">All live</button>
    <button data-f="new" aria-pressed="false">New<span class="cnt" id="cntNew"></span></button>
    <button data-f="bidding" aria-pressed="false">★ Bidding<span class="cnt" id="cntBid"></span></button>
    <button data-f="soon" aria-pressed="false">Ending in 24h</button>
    <button data-f="clears" aria-pressed="false">Under max bid</button>
    <button data-f="ended" aria-pressed="false">Ended</button>
  </div>
  <div class="seg" role="group" aria-label="Sort">
    <button data-s="margin" aria-pressed="true">Best margin</button>
    <button data-s="ending" aria-pressed="false">Ending soonest</button>
  </div>
  <label class="small"><input type="checkbox" id="hideHigh" checked> Hide high fake risk</label>
  <button class="btn" id="markSeen" hidden>Mark all seen</button>
  <span class="spacer"></span>
  <button class="btn" id="refresh">Check bids now</button>
</div>
<p class="assume" id="assume"></p>
<main>
  <div class="head" aria-hidden="true">
    <div>Watch</div><div class="num">Price</div><div class="num">Ends</div><div class="num">Value</div>
    <div>Cost vs value</div><div class="num">Profit</div><div class="num">Max bid</div>
  </div>
  <div id="rows"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const money = v => v == null ? "–" : (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString(undefined,{maximumFractionDigits:0});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CONCERN = {none_visible:["var(--lume)","No visible red flags (not proof)"], some:["var(--brass)","Some concerns"],
                 high:["var(--oxblood)","High fake risk"], cannot_assess:["var(--muted)","Photos too poor to judge"]};
let data = {rows:[]}, filter = "all", sort = "margin", prevPrice = {}, openKeys = new Set();
const LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
const HIDDEN_KEY = "wh-hidden", SEEN_KEY = "wh-seen", BID_KEY = "wh-bidding";
function getSet(k){ try { return new Set(JSON.parse(localStorage.getItem(k) || "[]")); } catch(e){ return new Set(); } }
function putSet(k, set){ try { localStorage.setItem(k, JSON.stringify([...set])); } catch(e){} }
function markSeen(keys){ const s = getSet(SEEN_KEY); keys.forEach(k => s.add(k)); putSet(SEEN_KEY, s); }
function toggleBid(key){ const b = getSet(BID_KEY); b.has(key) ? b.delete(key) : (b.add(key), markSeen([key])); putSet(BID_KEY, b); }
function hidden(){ try { return new Set(JSON.parse(localStorage.getItem(HIDDEN_KEY) || "[]")); } catch(e){ return new Set(); } }
function hide(key){ try { const h = hidden(); h.add(key); localStorage.setItem(HIDDEN_KEY, JSON.stringify([...h])); } catch(e){} }

function hoursLeft(r){
  if (r.end_time){ const t = Date.parse(r.end_time.endsWith("Z")||/[+-]\d\d:\d\d$/.test(r.end_time) ? r.end_time : r.end_time + "Z");
    if (!isNaN(t)) return (t - Date.now())/3.6e6; }
  if (r.time_left){ const g = k => +((r.time_left.match(new RegExp("(\\d+)"+k))||[0,0])[1]); return g("d")*24+g("h")+g("m")/60; }
  return null;
}
function fmtLeft(h){
  if (h == null) return "–"; if (h <= 0) return "Ended";
  const d = Math.floor(h/24), hh = Math.floor(h%24), m = Math.floor((h*60)%60);
  return d ? `${d}d ${hh}h` : hh ? `${hh}h ${m}m` : `${m}m`;
}
function gauge(r){
  const e = r.econ, v = e.value;
  if (!v) return `<div class="gauge"><span class="none">No value estimate yet</span></div>`;
  const max = Math.max(v.high, e.all_in) * 1.12, pct = x => (100 * x / max).toFixed(2) + "%";
  const color = e.max_bid != null && r.price <= e.max_bid ? "var(--lume)" : e.net_low > 0 ? "var(--brass)" : "var(--oxblood)";
  return `<div class="gauge" title="Brass band: value ${money(v.low)} to ${money(v.high)} (${esc(v.basis_note)}). Needle: your all-in cost ${money(e.all_in)}. Green clears your target margin, brass is profitable but thin, red loses money at the low estimate.">
    <div class="ticks"></div><div class="track"></div>
    <div class="band ${v.basis}" style="left:${pct(v.low)};width:calc(${pct(v.high)} - ${pct(v.low)})"></div>
    <div class="mid" style="left:${pct(v.mid)}"></div>
    <div class="needle" style="left:${pct(e.all_in)};background:${color}"></div></div>`;
}
const BASIS = {sold: "sold data", market: "Lens market", ai: "AI guess", manual: "your estimate"};
function marketHtml(r){
  const m = r.market;
  if (!m) return "";
  if (m.condition_mismatch) return `<div><b>Google Lens asking prices</b><div>${m.count} matches around ${money(m.median)}, but they are better-condition examples than this one, so the AI's as-is value is used.</div></div>`;
  if (m.skipped === "lot") return `<div><b>Google Lens</b><div>Multi-watch lot, so Lens prices are not used. Value is the AI estimate for the whole lot.</div></div>`;
  if (!m.count) return `<div><b>Google Lens</b><div>${r.lens_guess ? "Best guess: " + esc(r.lens_guess) + ". " : ""}No priced matches for this model.</div></div>`;
  return `<div><b>Google Lens asking prices</b><div>${m.count} secondhand ${m.match_level === "reference" ? "exact-reference" : "brand + model"} matches, median ${money(m.median)}, ${money(m.low)} to ${money(m.high)}.</div>
    <ul>${(m.examples || []).map(x => `<li><a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.title)}</a> ${esc(x.source)} ${money(x.price)}</li>`).join("")}</ul></div>`;
}
const pct100 = p => Math.round(p * 100) + "%";
function genuineTag(r){
  const e = r.econ;
  if (e.fake_risk && e.genuine_chance != null) {
    const cls = e.genuine_chance >= 0.6 ? "pos" : e.genuine_chance >= 0.3 ? "" : "risk";
    return `<div class="small ${cls}">${pct100(e.genuine_chance)} genuine</div>`;
  }
  if (r.is_lot) return `<div class="small">mixed lot</div>`;
  if (r.hand_picked) return `<div class="small">hand-picked</div>`;
  if (r.concern) return `<div class="small">rarely faked</div>`;
  return `<div class="small">not checked</div>`;
}
function riskHtml(r){
  const e = r.econ, v = e.value;
  if (!e.fake_risk) return r.concern && !r.is_lot ? `<div><b>Counterfeit risk</b><div>Low: this brand is rarely counterfeited, so no adjustment is made. Red flags above still apply.</div></div>` : "";
  const rep = r.replicas || {}, steps = e.genuine_steps || [];
  const stepHtml = steps.map(s => `<li>${esc(s.label)}${s.weight != null ? ` <span class="small">×${s.weight}</span>` : ""} → <b>${pct100(s.chance)}</b>${s.note ? `<div class="small">${esc(s.note)}</div>` : ""}</li>`).join("");
  return `<div><b>Counterfeit risk: ${e.genuine_chance != null ? pct100(e.genuine_chance) + " chance genuine" : "not checked yet"}</b>
    <div>${v && v.genuine_low != null ? `Worth ${money(v.genuine_low)} to ${money(v.genuine_high)} if genuine. ` : ""}Cost includes ${money(e.auth_cost)} to authenticate before you resell.</div>
    ${stepHtml ? `<div style="margin-top:6px">How the chance was worked out:</div><ol class="steps">${stepHtml}</ol>` : ""}
    ${rep.count && !(rep.share >= 0.3) ? `<div class="small">Google Lens: ${rep.count} replica listings among the matches (${pct100(rep.share)}), too few to count.</div>` : ""}
    ${r.questions && r.questions.length ? `<div>Ask the seller:</div><ul>${r.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul>` : ""}</div>`;
}
function row(r){
  const e = r.econ, v = e.value, h = hoursLeft(r), [cc, cl] = CONCERN[r.concern] || ["var(--muted)","Not AI checked"];
  const flashed = prevPrice[r.key] != null && prevPrice[r.key] !== r.price ? " flash" : "";
  const netCls = e.net_mid == null ? "" : e.net_mid >= 0 ? "pos" : "neg";
  const under = e.max_bid != null && r.price <= e.max_bid;
  const bidding = BIDS.has(r.key), isNew = r.status === "active" && !SEEN.has(r.key);
  return `<details class="row ${r.status}${bidding ? " bidding" : ""}" data-key="${esc(r.key)}" ${openKeys.has(r.key) ? "open" : ""}>
  <summary>
    <div class="c-watch watch">${r.image ? `<img src="${esc(r.image)}" alt="" loading="lazy">` : `<img alt="">`}
      <div class="t"><div class="name"><button class="star${bidding ? " on" : ""}" data-bid="${esc(r.key)}" aria-pressed="${bidding}" title="${bidding ? "Remove from Bidding" : "Mark as bidding"}">${bidding ? "★" : "☆"}</button>${isNew ? `<span class="badge-new">NEW</span>` : ""}${esc(r.name || r.title)}</div>
      <div class="sub"><span class="concern" style="background:${cc}" title="${cl}"></span>${esc(r.source)}${r.reference ? " " + esc(r.reference) : ""}${r.era ? ", " + esc(r.era) : ""}</div></div></div>
    <div class="c-price num"><div class="fig${flashed}">${money(r.price)}</div><div class="small">${r.bids != null ? r.bids + " bids" : "buy now"}</div></div>
    <div class="c-ends num"><div class="fig" data-left="${esc(r.key)}">${r.status === "ended" ? "Ended" : fmtLeft(h)}</div></div>
    <div class="c-value num"><div class="fig">${v ? money(v.mid) : "–"}</div><div class="small">${v ? BASIS[v.basis] || v.basis : ""}</div>${genuineTag(r)}</div>
    <div class="c-gauge">${gauge(r)}</div>
    <div class="c-net num" title="Likely: profit if it sells mid-range, after fees, shipping and repairs. Worst case: profit if it sells at the low end."><div class="small ml">Profit</div><div class="fig ${netCls}">${e.net_mid == null ? "–" : money(e.net_mid)}</div><div class="small">${e.net_mid == null ? "" : "likely"}</div>${e.net_low != null ? `<div class="small ${e.net_low >= 0 ? "pos" : "neg"}">worst ${money(e.net_low)}</div>` : ""}</div>
    <div class="c-max num"><div class="small ml">Max bid</div><div class="fig ${under ? "pos" : ""}">${e.max_bid === 0 ? "Pass" : money(e.max_bid)}</div><div class="small">${e.max_bid === 0 ? "too thin" : under ? "price is under" : e.max_bid != null ? "price is over" : ""}</div>${r.your_max != null ? `<div class="small">yours ${money(r.your_max)}</div>` : ""}</div>
  </summary>
  <div class="detail">
    <div><b>${esc(r.title)}</b><div>${esc(r.summary)}</div></div>
    <div><b>${cl}</b>${r.flags && r.flags.length ? `<ul>${r.flags.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}</div>
    <div><b>How the numbers work</b><div>All-in cost ${money(e.all_in)} includes ${money(e.service)} service,${e.auth_cost ? ` ${money(e.auth_cost)} authentication,` : ""} ${money(e.ship_in)} inbound shipping${e.ship_in_basis === "listing" ? " (from the listing)" : " (estimate)"}.
      ${v ? `Value ${money(v.low)} to ${money(v.high)} from ${esc(v.basis_note)}. Max bid uses the low end.` : "Needs sold data, an AI estimate, or a value in your watchlist entry."}</div></div>
    ${riskHtml(r)}
    ${marketHtml(r)}
    <div class="actions"><a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">Open listing</a>
      <button class="btn" data-bid="${esc(r.key)}">${bidding ? "★ Stop tracking bid" : "☆ I'm bidding on this"}</button>
      <button class="btn" data-dismiss="${esc(r.key)}">${LOCAL ? "Remove from board" : "Hide on this device"}</button></div>
  </div></details>`;
}
let SEEN = new Set(), BIDS = new Set();
function render(){
  SEEN = getSet(SEEN_KEY); BIDS = getSet(BID_KEY);
  const hid = LOCAL ? new Set() : hidden();
  const risky = r => $("#hideHigh").checked && (r.concern === "high" || (r.econ.genuine_chance != null && r.econ.genuine_chance < 0.1));
  const live = data.rows.filter(r => !hid.has(r.key) && r.status === "active" && !risky(r));
  const newKeys = live.filter(r => !SEEN.has(r.key)).map(r => r.key);
  $("#cntNew").textContent = newKeys.length ? ` ${newKeys.length}` : "";
  $("#cntBid").textContent = BIDS.size ? ` ${data.rows.filter(r => BIDS.has(r.key)).length}` : "";
  $("#markSeen").hidden = !newKeys.length;
  // Bidding shows your watches whether live or ended, so you can see how each one finished.
  let rows = filter === "bidding" ? data.rows.filter(r => BIDS.has(r.key))
    : data.rows.filter(r => !hid.has(r.key) && (filter === "ended" ? r.status === "ended" : r.status === "active"));
  if (filter === "new") rows = rows.filter(r => !SEEN.has(r.key));
  if (filter === "soon") rows = rows.filter(r => { const h = hoursLeft(r); return h != null && h < 24; });
  if (filter === "clears") rows = rows.filter(r => r.econ.max_bid != null && r.price <= r.econ.max_bid);
  // High fake risk: the AI's overall call is high concern, or the evidence puts it under 10% genuine.
  if ($("#hideHigh").checked) rows = rows.filter(r => r.concern !== "high" && !(r.econ.genuine_chance != null && r.econ.genuine_chance < 0.1));
  rows.sort(sort === "ending"
    ? (a,b) => (hoursLeft(a) ?? 1e9) - (hoursLeft(b) ?? 1e9)
    : (a,b) => (b.econ.margin_pct ?? -1e9) - (a.econ.margin_pct ?? -1e9));
  $("#rows").innerHTML = rows.length ? rows.map(row).join("") :
    filter === "bidding" ? `<p class="empty">No watches marked yet. Tap the ☆ next to a watch you've bid on and it shows up here, including after the auction ends.</p>` :
    filter === "new" ? `<p class="empty">You're caught up. Watches you haven't opened yet show up here with a NEW tag.</p>` :
    data.rows.length ? `<p class="empty">Nothing matches this filter.</p>` :
    `<p class="empty">The board fills from your daily runs. Run <code>python main.py</code>, then reload. Every AI-checked watch lands here.</p>`;
  data.rows.forEach(r => prevPrice[r.key] = r.price);
}
function status(){
  const s = data.state || {}, when = s.last_refresh ? Math.round((Date.now() - Date.parse(s.last_refresh))/60000) : null;
  const live = data.rows.filter(r => r.status === "active").length;
  $("#status").innerHTML = `<b>${live}</b> watches live. ` +
    (s.refreshing ? "Checking bids now." : when == null ? "Bids not checked yet." :
      data.mode === "static" ? `Updated <b>${when} min</b> ago. Refreshes about hourly.` : `Bids checked <b>${when} min</b> ago, every ${data.refresh_minutes} min.`);
  const a = data.assumptions || {};
  $("#assume").textContent = `Assumes ${a.sell_fee_pct}% selling fees, $${a.ship_in} shipping in, $${a.ship_out} shipping out and a ${a.target_margin_pct}% target margin. Change these in config.yaml. Solid bands are sold data, dotted bands are discounted Google Lens asking prices, dashed bands are AI guesses. The needle is your all-in cost: green clears your target, brass is thin, red loses money at the low estimate.`;
  $("#err").hidden = !s.last_error; $("#err").textContent = s.last_error ? "Last bid check failed: " + s.last_error : "";
}
async function load(){
  try { data = await (await fetch(LOCAL ? "/api/board" : "board.json?t=" + Date.now(), {cache: "no-store"})).json(); render(); status(); setupRefresh(); }
  catch(e){ $("#status").textContent = LOCAL ? "Can't reach the board server. Is python dashboard.py running?" : "Board data not published yet. Run the workflow on GitHub first."; }
}
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-bid]");
  if (b){ ev.preventDefault(); ev.stopPropagation(); toggleBid(b.dataset.bid); render(); return; }
  const f = ev.target.closest("[data-f]"), s = ev.target.closest("[data-s]"), d = ev.target.closest("[data-dismiss]");
  if (f){ filter = f.dataset.f; document.querySelectorAll("[data-f]").forEach(b => b.setAttribute("aria-pressed", b === f)); render(); }
  if (s){ sort = s.dataset.s; document.querySelectorAll("[data-s]").forEach(b => b.setAttribute("aria-pressed", b === s)); render(); }
  if (d){ if (LOCAL){ await fetch("/api/dismiss",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:d.dataset.dismiss})}); load(); } else { hide(d.dataset.dismiss); render(); } }
});
document.addEventListener("toggle", ev => { const k = ev.target.dataset?.key; if (!k) return;
  if (ev.target.open){ openKeys.add(k); if (!SEEN.has(k)){ markSeen([k]); SEEN.add(k);
    const badge = ev.target.querySelector(".badge-new"); if (badge) badge.remove();
    const hideHigh = $("#hideHigh").checked;
    const n = data.rows.filter(r => r.status === "active" && !getSet(SEEN_KEY).has(r.key) && !hidden().has(r.key)
      && !(hideHigh && (r.concern === "high" || (r.econ.genuine_chance != null && r.econ.genuine_chance < 0.1)))).length;
    $("#cntNew").textContent = n ? ` ${n}` : ""; $("#markSeen").hidden = !n; } }
  else openKeys.delete(k); }, true);
$("#markSeen").addEventListener("click", () => { markSeen(data.rows.map(r => r.key)); render(); });
$("#hideHigh").addEventListener("change", render);
let refreshWired = false;
function setupRefresh(){
  if (refreshWired) return; refreshWired = true;
  const btn = $("#refresh");
  if (LOCAL){
    btn.addEventListener("click", async () => { await fetch("/api/refresh",{method:"POST"}); $("#status").textContent = "Checking bids now."; setTimeout(load, 4000); });
  } else if (data.actions_url){
    btn.textContent = "↻ Check bids now";
    btn.title = "Re-checks prices and bids on GitHub, then reloads the board (about 3 minutes). Shift-click to forget your saved key.";
    btn.addEventListener("click", ev => ghRefresh(btn, ev.shiftKey));
  } else { btn.style.display = "none"; }
}
// Static (GitHub Pages) refresh: starts the workflow with a GitHub token kept only in this browser.
const TOKEN_KEY = "wh_gh_token";
function getStored(){ try { return localStorage.getItem(TOKEN_KEY); } catch(e){ return null; } }
function setStored(v){ try { v ? localStorage.setItem(TOKEN_KEY, v) : localStorage.removeItem(TOKEN_KEY); } catch(e){} }
async function ghRefresh(btn, forget){
  if (forget){ setStored(null); $("#status").textContent = "Saved GitHub key removed from this browser."; return; }
  const m = (data.actions_url || "").match(/github\.com\/([^/]+\/[^/]+)\/actions\/workflows\/([^/?#]+)/);
  if (!m) { window.open(data.actions_url, "_blank", "noopener"); return; }
  const [, repo, wf] = m;
  let token = getStored();
  if (!token){
    token = (prompt("One-time setup: paste a GitHub fine-grained token for this repo with Actions: Read and write. It's saved only in this browser.") || "").trim();
    if (!token) return;
  }
  btn.disabled = true;
  const before = (data.state || {}).last_refresh;
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${wf}/dispatches`, {
      method: "POST",
      headers: {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json"},
      body: JSON.stringify({ref: "main", inputs: {mode: "refresh"}})});
    if (r.status === 401 || r.status === 403 || r.status === 404){
      setStored(null); btn.disabled = false;
      $("#status").textContent = "GitHub didn't accept that key (needs Actions: Read and write on this repo). Click again to paste a new one.";
      return;
    }
    if (!r.ok) throw new Error("GitHub said " + r.status);
    setStored(token);
  } catch(e){
    btn.disabled = false; $("#status").textContent = "Couldn't start the refresh: " + e.message; return;
  }
  const started = Date.now();
  $("#status").textContent = "Checking bids on GitHub. The board reloads itself when it's done, usually in about 3 minutes.";
  const poll = setInterval(async () => {
    try {
      const d = await (await fetch("board.json?t=" + Date.now(), {cache: "no-store"})).json();
      if ((d.state || {}).last_refresh !== before){ clearInterval(poll); btn.disabled = false; load(); return; }
    } catch(e){}
    if (Date.now() - started > 10 * 60000){ clearInterval(poll); btn.disabled = false;
      $("#status").textContent = "Still waiting on GitHub after 10 minutes. Check the Actions tab."; }
  }, 20000);
}
setInterval(load, LOCAL ? 30000 : 300000);
setInterval(() => document.querySelectorAll("[data-left]").forEach(el => {
  const r = data.rows.find(x => x.key === el.dataset.left); if (r && r.status === "active") el.textContent = fmtLeft(hoursLeft(r));
}), 30000);
load();
</script>
