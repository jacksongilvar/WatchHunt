# WatchHunt config. Edit freely. Restart not needed; it is read on every run.

search:
  min_price: 10
  max_price: 200             # SKX test budget. Raise later.
  polite_delay_seconds: 2    # pause between requests to the same site

scoring:
  min_score_for_digest: 4    # heuristic score needed to appear in the digest
  min_score_for_ai: 5        # heuristic score needed to spend an AI call
  # Listings with these words always get an AI check whatever their score: the cheap quartz watches Goodwill
  # lists as "untested" because it does not replace batteries. Still capped by ai.max_listings_per_run.
  always_ai_words: [perpetual, eco-drive, eco drive, 8f32, 8f33, 8f35, 8f56]
  # Brand searches (rolex, cartier, tudor) also return perfume, clocks, flatware and DVDs. For fake-risk brands the
  # title must contain one of these words or one of the brand's model names (brands.<name>.also), or it is dropped.
  watch_words: [watch, watches, wristwatch, wrist watch, timepiece, chronograph, chronometer, automatic, self winding,
                manual wind, quartz, rubies, jewels, movement, dial, bezel, caseback, oyster]

ai:
  enabled: true
  model: claude-sonnet-5-5   # any Claude model with vision
  max_listings_per_run: 25   # hard cap on AI calls per run (cost control)
  max_images_per_listing: 4
  max_images_high_risk: 8    # Rolex, Cartier, Tudor: more photos (caseback, clasp, rehaut) to check for fakes
  max_tokens: 8000           # output room per check. Luxury-brand checklists are long; 3000 cut them off

# Google Lens via SerpApi (serpapi.com). Runs on each AI-checked listing's main photo, before Claude.
# Lens match titles help Claude identify the watch; priced matches become the "market" value band.
# Each lookup is one SerpApi search. Needs SERPAPI_API_KEY.
lens:
  enabled: true
  max_per_run: 1             # hard cap on Lens searches per run (cost control). 1 x 8 scans/day fits the free plan
  country: us
  max_matches: 40            # visual matches kept per photo
  min_reference_matches: 3   # price from exact-reference matches when at least this many, else brand + model
  # Only prices from these secondhand sites count. New retail (Macy's, Amazon, brand sites) overstates used value.
  used_sources: [ebay, mercari, poshmark, chrono24, watchuseek, etsy, shopgoodwill, offerup, facebook,
                 grailzee, crownandcaliber, crown & caliber, bobswatches, bob's watches, watchbox, thewatchbox,
                 1stdibs, ruby lane, rubylane, worthpoint, hibid, liveauctioneers, propertyroom, reddit,
                 omegaforums, rolexforums, watchcharts, depop, vinted, carousell,
                 secondhand, second hand, pre-owned, preowned]

comps:
  shopgoodwill_sold: true    # look up recent ShopGoodwill sold prices for AI-identified watches
  harvest_closes: true       # record finished ShopGoodwill auctions for every search as real price comps
  closed_pages: 2            # pages of 40 per search per scan

ebay:
  enabled: true
  marketplace: EBAY_US
  category_ids: ["31387"]    # Wristwatches
  limit_per_query: 100
  queries:
    # SKX test targets
    - seiko 7s26
    - seiko diver automatic
    - seiko skx
    - seiko 200m automatic
    # vague / low-effort listings
    - old watch untested
    - grandfathers watch
    - estate watch
    - vintage mens watch as is
    - watch lot untested
    - swiss watch not working
    - gold watch unknown
    - automatic watch needs service
    # misspellings
    # Rolex, Cartier, Tudor: higher price ceiling. Fakes are common here; see economics.fake_risk.
    - {q: rolex watch, max_price: 1500}
    - {q: rolex vintage, max_price: 1500}
    - {q: cartier watch, max_price: 1500}
    - {q: cartier tank, max_price: 1500}
    - {q: cartier santos, max_price: 1500}
    - {q: tudor watch, max_price: 1500}
    - {q: tudor vintage, max_price: 1500}
    - rolx
    - rollex watch
    - omeaga watch
    - omgea
    - seamster watch
    - cartie watch
    - catier watch
    - sieko watch
    - seico automatic
    - longine watch
    - brietling
    - hueur
    - tudur watch
    - lecoultre watch
    - patek phillipe

shopgoodwill:
  enabled: true
  page_size: 40
  queries:
    - seiko automatic
    - seiko diver
    - seiko 7s26
    - seiko skx
    - seiko 21 jewels
    - seiko perpetual
    - seiko 8f
    - citizen perpetual
    - {q: rolex, max_price: 1500}
    - {q: cartier, max_price: 1500}
    - {q: tudor, max_price: 1500}

propertyroom:
  enabled: true
  pages_per_category: 3
  category_paths:
    - /c/watches_mens-watches
    - /c/watches_bulk-lots
    - /c/watches_womens-watches

# Listings containing any of these are dropped before scoring.
