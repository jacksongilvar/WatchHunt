# Phrases that suggest the seller does not know what they have.
vague_terms:
  untested: 2
  not running: 1
  not working: 1
  as is: 1
  estate: 1
  grandfather: 2
  grandfathers: 2
  grandpa: 2
  dads: 1
  found in: 1
  unknown: 2
  not sure: 2
  no idea: 2
  old watch: 2
  needs service: 1
  needs repair: 1
  junk drawer: 2
  for parts: 1

