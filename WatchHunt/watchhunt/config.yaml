# How comps are matched and weighted (closes.py PriceIndex). Defaults are starting points; backtest.py tells you
# whether they work.
pricing:
  half_life_days: 90        # a comp this old counts half as much as one from today
  max_age_days: 365         # older comps are ignored
  # Most specific first. A level is used only when it has at least min comps; otherwise fall back to the next.
  levels:
    - {name: reference, fields: [brand, ref, wearer, material], min: 3}
    - {name: calibre,   fields: [brand, cal, wearer, material], min: 3}
    - {name: family,    fields: [brand, family, move, wearer, material], min: 4}
    - {name: movement,  fields: [brand, move, wearer, material], min: 6}
    - {name: brand,     fields: [brand, wearer], min: 8}
  # Prices are moved between conditions with these factors (unknown = typical untested Goodwill listing).
  # backtest.py prints the factors your own data implies; copy them here once there are enough comps.
  condition_factor: {working: 1.2, unknown: 1.0, parts: 0.55}
  boxed_factor: 1.1
  # Grades: A and B can set a value on the board. C and D only show where auctions like it usually end.
  grade_a: {levels: [reference, calibre], min_count: 5, max_spread: 0.6}
  grade_b: {levels: [reference, calibre, family], min_count: 4}
  grade_c: {levels: [movement]}
  # Retail (what you can sell for) vs wholesale (where auctions end). Your profit is the gap.
  # retail_csv: your own sales and hand-logged eBay (Terapeak) sold prices. See data/retail_comps.csv.
  # retail_sheet_csv_url: optional. Your WatchHunter Google Sheet published as CSV (File > Share > Publish to web).
  retail_csv: data/retail_comps.csv
  retail_sheet_csv_url: ""
  # When a watch has wholesale comps but no retail comps, retail = wholesale x this. 1.0 means "assume no spread",
  # which is the honest default until your own sales prove otherwise. backtest.py prints the ratio your data shows.
  retail_ratio_default: 1.0
  min_ratio_pairs: 5        # models with both retail and wholesale comps needed before the measured ratio is used

# Live board (python dashboard.py)
dashboard:
  host: 127.0.0.1          # use 0.0.0.0 to open it from your phone on the same wifi
  port: 8000
  refresh_minutes: 10      # how often to re-check bids on tracked watches
  track_min_score: 6       # text-only listings at or above this also go on the board

# Cost assumptions behind "net margin" and "max bid". VERIFY these; they drive every number.
economics:
  target_margin_pct: 30    # max bid is the highest price that still clears this margin at the LOW value estimate
  ship_in: 15              # what you pay to receive it
  # Where you sell decides fees and outbound shipping. channel picks one of channels below.
  channel: local
  channels:
    local:    {sell_fee_pct: 0,  ship_out: 0}    # Facebook Marketplace, OfferUp, in person
    ebay:     {sell_fee_pct: 15, ship_out: 20}   # final value fee + payment, insured shipping you pay
    poshmark: {sell_fee_pct: 20, ship_out: 0}    # buyer pays the shipping label
  sell_fee_pct: 15         # used only if channel is missing
  ship_out: 20
  min_closes: 3            # tracked auction finals for the same brand and movement needed to price from them
  buyer_premium_pct: {ebay: 0, shopgoodwill: 0, propertyroom: 0}   # check each site's current terms
  # Service: what it costs to get a watch ready to sell, priced job by job (see service.py).
  # cost is [everyday brands, mid Swiss, luxury] by brands.<name>.tier. Unknown brands count as everyday.
  # The AI picks jobs from the photos (service_needs). Older checks fall back to reading the condition notes.
  # A watchlist entry can fix it: service: 40 (a total) or jobs: [battery, crystal].
  # Prices are rough independent-watchmaker estimates. Replace them with real quotes as you get them.
  service:
    jobs:
      battery:             {cost: [20, 30, 60],    label: "Battery",                        ask: "quartz watch needs a battery (added automatically for quartz)"}
      calendar_reset:      {cost: [15, 25, 60],    label: "Perpetual calendar reset",       ask: "perpetual calendar must be reset after a battery (added automatically)"}
      solar_cell:          {cost: [60, 90, 150],   label: "Solar rechargeable cell",        ask: "Eco-Drive or solar watch that will not hold a charge, ticks every 2 seconds or is described as failing"}
      kinetic_cell:        {cost: [60, 90, 150],   label: "Kinetic capacitor",              ask: "any Kinetic or auto-quartz watch"}
      quartz_movement:     {cost: [40, 120, 300],  label: "Replacement quartz movement",    ask: "quartz watch described as broken for reasons a battery will not fix"}
      crystal:             {cost: [30, 60, 150],   label: "New crystal",                    ask: "crystal cracked, chipped or deeply scratched (light scratches can be polished, not a job)"}
      strap:               {cost: [12, 25, 60],    label: "Strap or band",                  ask: "head only, or the strap or band is missing, broken or too worn to sell on"}
      crown_stem:          {cost: [25, 60, 150],   label: "Crown or stem",                  ask: "crown missing, loose, or stem broken"}
      clean_regulate:      {cost: [40, 80, 150],   label: "Clean and regulate",             ask: "mechanical watch that is untested or runs poorly but shows no sign of damage"}
      full_service:        {cost: [120, 250, 450], label: "Full service",                   ask: "mechanical watch that does not run, stops, is sold for parts or repair, or shows water inside"}
      full_service_chrono: {cost: [200, 400, 700], label: "Full service (chronograph)",     ask: "mechanical chronograph that does not run or is sold for parts or repair"}
  ladies_value_factor: 0.5   # hand-entered values assume men's; women's watches get this share of it
  min_comps: 5             # sold results needed before sold data outranks everything else
  # Counterfeit risk, for brands with fake_risk: true.
  # Chance genuine starts at the brand's base rate, then each piece of evidence multiplies the odds:
  #   pass: 5    -> seen 5 times more often on genuine watches than fakes (strong evidence it is genuine)
  #   fail: 0.1  -> seen 10 times more often on fakes (strong evidence it is fake)
  #   unclear or not shown -> no change. Missing evidence does not move the number either way.
  # These weights are expert estimates, not measured data. Tune them as you get watches authenticated.
  # Value = chance x genuine value + (1 - chance) x fake_value. The authentication cost is added to all-in.
  fake_risk:
    # Rough share of genuine pieces among cheap, non-specialist listings (Goodwill, police auctions, vague eBay).
    base_rate: {rolex: 0.25, cartier: 0.3, tudor: 0.35, omega: 0.5, breitling: 0.45, tag heuer: 0.55,
                patek philippe: 0.08, audemars piguet: 0.08, iwc: 0.5}
    max_chance: 0.9      # photos alone never make it certain
    min_chance: 0.01
    checks:              # brands: limits a check to those brands
      movement:         {ask: "Movement shown and the correct signed calibre for this model and era", pass: 5, fail: 0.05}
      caseback:         {ask: "Caseback type, engravings and markings correct for the model (plain on most Rolex)", pass: 1.5, fail: 0.1}
      serial:           {ask: "Serial and reference engraved in the right place and consistent with the model and era", pass: 2.5, fail: 0.15}
      dial_print:       {ask: "Dial print crisp, evenly spaced, correct fonts, no bleed", pass: 1.5, fail: 0.2}
      logo:             {ask: "Logo shape, size and position correct", pass: 1.3, fail: 0.15}
      hands_markers:    {ask: "Hands and markers correct for the reference, lume consistent", pass: 1.2, fail: 0.35}
      case_finish:      {ask: "Case shape, lug proportions, finishing and crown correct", pass: 1.3, fail: 0.25}
      bracelet_clasp:   {ask: "Bracelet, end links and clasp correct for the model, with correct stamps", pass: 1.4, fail: 0.3}
      photos_original:  {ask: "Photos are the seller's own, not stock or lifted from other listings", pass: 1.2, fail: 0.4}
      cyclops:          {brands: [rolex, tudor], ask: "Date magnifier about 2.5x and centred over the date (not_shown if no date)", pass: 1.5, fail: 0.15}
      rehaut:           {brands: [rolex], ask: "Rehaut engraving present and correct on post-2007 models, absent on older ones", pass: 1.5, fail: 0.2}
      secret_signature: {brands: [cartier], ask: "Secret signature in the VII or X on models that have one", pass: 3, fail: 0.3}
      cabochon_crown:   {brands: [cartier], ask: "Crown cabochon present and correct for the model", pass: 1.2, fail: 0.4}
      blued_hands:      {brands: [cartier], ask: "Blued steel sword hands on models that have them", pass: 1.2, fail: 0.4}
      rolex_parts:      {brands: [tudor], ask: "Vintage Tudor: Rolex-signed case, crown or caseback where correct for the era", pass: 2, fail: 0.4}
    # A fixed (buy now) price far below genuine value is a fake pattern. Auction bids are not: they always start low.
    buy_now_price:
      - {below: 0.15, weight: 0.3}   # under 15% of the low genuine value
      - {below: 0.35, weight: 0.6}
    replica_share_threshold: 0.3     # replicas copy real models, so only a large share of replica Lens matches counts
    replica_weight: 0.5
    # Rows checked before per-check scoring existed fall back to the overall concern level.
    fallback_by_concern: {none_visible: 0.6, some: 0.2, cannot_assess: 0.3, high: 0.02}
    fake_value: 25                   # what a fake sells for (often nothing; selling one knowingly is illegal)
    authentication_cost: {rolex: 150, cartier: 120, tudor: 120, omega: 100, breitling: 100, tag heuer: 80,
                          patek philippe: 250, audemars piguet: 250, iwc: 100}
  lens:
    min_prices: 4          # priced Lens matches needed before market data outranks the AI guess
    asking_discount: 0.8   # asking prices run above what watches actually sell for; value = asking x this
    condition_gap: 2.0     # if Lens value is over 2x the AI's as-is high estimate, Lens matched better-condition pieces

# Hand-picked listings to put on the board. They're added on the next hourly run and
# their bids refresh like everything else. shipping = what you pay to receive it.
# value = [low, high] resale or melt you expect, service = repair cost before selling (0 if none). Add a line with an item id from the listing URL.
# wearer: ladies = your value already assumes a women's watch, so the women's cut is not applied again.
# Signs that few people are bidding: shown as a QUIET badge and the "Low competition" filter.
competition:
  late_hours: 6            # within this many hours of the end...
  max_bids_late: 2         # ...with this many bids or fewer
  quiet_hours_et: [6, 15]  # ShopGoodwill closes between 6am and 3pm ET draw fewer bidders
  utc_offset_hours: 4      # Eastern daylight time (use 5 in winter)
  min_signals: 2           # other signals needed together (misspelled, vague title, untested quartz, daytime close)

