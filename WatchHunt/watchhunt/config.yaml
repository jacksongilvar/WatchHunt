# WatchHunt config. Edit freely. Restart not needed; it is read on every run.

search:
  min_price: 10
  max_price: 200             # SKX test budget. Raise later.
  polite_delay_seconds: 2    # pause between requests to the same site

scoring:
  min_score_for_digest: 4    # heuristic score needed to appear in the digest
  min_score_for_ai: 5        # heuristic score needed to spend an AI call
  # Brand searches (rolex, cartier, tudor) also return perfume, clocks, flatware and DVDs. For fake-risk brands the
  # title must contain one of these words or one of the brand's model names (brands.<name>.also), or it is dropped.
  watch_words: [watch, watches, wristwatch, wrist watch, timepiece, chronograph, chronometer, automatic, self winding,
                manual wind, quartz, rubies, jewels, movement, dial, bezel, caseback, oyster]

ai:
  enabled: true
  model: claude-sonnet-5-5   # any Claude model with vision
  max_listings_per_run: 25   # hard cap on AI calls per run (cost control)
  max_images_per_listing: 4
  max_images_high_risk: 8    # Rolex, Cartier, Tudor: more photos (caseback, clasp, rehaut) to check for fakes

# Google Lens via SerpApi (serpapi.com). Runs on each AI-checked listing's main photo, before Claude.
# Lens match titles help Claude identify the watch; priced matches become the "market" value band.
# Each lookup is one SerpApi search. Needs SERPAPI_API_KEY.
lens:
  enabled: true
  max_per_run: 1             # hard cap on Lens searches per run (cost control). 1 x 8 scans/day fits the free plan
  country: us
  max_matches: 40            # visual matches kept per photo
  min_reference_matches: 3   # price from exact-reference matches when at least this many, else brand + model
  # Only prices from these secondhand sites count. New retail (Macy's, Amazon, brand sites) overstates used value.
  used_sources: [ebay, mercari, poshmark, chrono24, watchuseek, etsy, shopgoodwill, offerup, facebook,
                 grailzee, crownandcaliber, crown & caliber, bobswatches, bob's watches, watchbox, thewatchbox,
                 1stdibs, ruby lane, rubylane, worthpoint, hibid, liveauctioneers, propertyroom, reddit,
                 omegaforums, rolexforums, watchcharts, depop, vinted, carousell,
                 secondhand, second hand, pre-owned, preowned]

comps:
  shopgoodwill_sold: true    # look up recent ShopGoodwill sold prices for AI-identified watches

ebay:
  enabled: true
  marketplace: EBAY_US
  category_ids: ["31387"]    # Wristwatches
  limit_per_query: 100
  queries:
    # SKX test targets
    - seiko 7s26
    - seiko diver automatic
    - seiko skx
    - seiko 200m automatic
    # vague / low-effort listings
    - old watch untested
    - grandfathers watch
    - estate watch
    - vintage mens watch as is
    - watch lot untested
    - swiss watch not working
    - gold watch unknown
    - automatic watch needs service
    # misspellings
    # Rolex, Cartier, Tudor: higher price ceiling. Fakes are common here; see economics.fake_risk.
    - {q: rolex watch, max_price: 1500}
    - {q: rolex vintage, max_price: 1500}
    - {q: cartier watch, max_price: 1500}
    - {q: cartier tank, max_price: 1500}
    - {q: cartier santos, max_price: 1500}
    - {q: tudor watch, max_price: 1500}
    - {q: tudor vintage, max_price: 1500}
    - rolx
    - rollex watch
    - omeaga watch
    - omgea
    - seamster watch
    - cartie watch
    - catier watch
    - sieko watch
    - seico automatic
    - longine watch
    - brietling
    - hueur
    - tudur watch
    - lecoultre watch
    - patek phillipe

shopgoodwill:
  enabled: true
  page_size: 40
  queries:
    - watch
    - wristwatch
    - {q: rolex, max_price: 1500}
    - {q: cartier, max_price: 1500}
    - {q: tudor, max_price: 1500}
    - watch lot
    - vintage watch
    - mens watch

propertyroom:
  enabled: true
  pages_per_category: 3
  category_paths:
    - /c/watches_mens-watches
    - /c/watches_bulk-lots
    - /c/watches_womens-watches

# Listings containing any of these are dropped before scoring.
exclude_terms:
  - homage
  - replica
  - inspired
  - tribute
  - style watch
  - smartwatch
  - smart watch
  - apple watch
  - fitbit
  - band only
  - strap only
  - box only
  - links only
  - bracelet only
  - oniss
  - adee kaye
  - invicta
  - lechateau
  - aquaswiss
  - geneva platinum
  - michael kors
  - fossil
  - guess
  - armitron
  # Not watches (brand searches pull these in)
  - clock
  - dealer display
  - pouch
  - spoon
  - spoons
  - wallet
  - keychain
  - key chain
  - perfume
  - parfum
  - eau de
  - fragrance
  - flatware
  - silverplate
  - stationery
  - figurine
  - dvd
  - playset
  - cufflinks
  - sunglasses
  - bottle stopper

# Phrases that suggest the seller does not know what they have.
vague_terms:
  untested: 2
  not running: 1
  not working: 1
  as is: 1
  estate: 1
  grandfather: 2
  grandfathers: 2
  grandpa: 2
  dads: 1
  found in: 1
  unknown: 2
  not sure: 2
  no idea: 2
  old watch: 2
  needs service: 1
  needs repair: 1
  junk drawer: 2
  for parts: 1

# tier: 3 = high value, 2 = mid, 1 = entry.
# also = legit alternate names or model names. misspellings = typos worth hunting.
brands:
  # max_price raises the $ ceiling for this brand. fake_risk turns on the counterfeit adjustment in economics.
  rolex:            {tier: 3, max_price: 1500, fake_risk: true, also: [oyster perpetual, datejust, submariner, oysterdate, air king, air-king, gmt master], misspellings: [rollex, rolx, rolax, roelx, rollx, rolexx, rollax]}
  cartier:          {tier: 3, max_price: 1500, fake_risk: true, also: [tank louis, tank francaise, tank solo, must de cartier, santos, panthere, ballon bleu, pasha], misspellings: [cartie, catier, cartiere, cartiar, carteir]}
  patek philippe:   {tier: 3, fake_risk: true, also: [patek], misspellings: [patek phillipe, patek philip, patek phillip]}
  audemars piguet:  {tier: 3, fake_risk: true, also: [audemars], misspellings: [audemar]}
  vacheron:         {tier: 3, also: [vacheron constantin], misspellings: [vacheron constantine]}
  jaeger lecoultre: {tier: 3, also: [lecoultre, le coultre, jaeger le coultre], misspellings: [jagger lecoultre, le coulter]}
  universal geneve: {tier: 3, also: [], misspellings: [universal geneva]}
  heuer:            {tier: 3, also: [], misspellings: [hueur, huer, hauer]}
  iwc:              {tier: 3, fake_risk: true, also: [schaffhausen], misspellings: []}
  omega:            {tier: 2, fake_risk: true, also: [seamaster, speedmaster, constellation, de ville], misspellings: [omeaga, omgea, omege, seamster]}
  tudor:            {tier: 2, max_price: 1500, fake_risk: true, also: [tudor prince, oysterdate tudor, black bay, tudor ranger, tudor submariner], misspellings: [tudur, tuder, tudar]}
  breitling:        {tier: 2, fake_risk: true, also: [navitimer], misspellings: [brietling, brightling, breitlng]}
  longines:         {tier: 2, also: [], misspellings: [longine, longenes, longins]}
  zenith:           {tier: 2, also: [el primero], misspellings: []}
  grand seiko:      {tier: 2, also: [], misspellings: []}
  tag heuer:        {tier: 2, fake_risk: true, also: [], misspellings: [tag hauer, tag huer]}
  seiko:            {tier: 1, also: [], misspellings: [sieko, seico, seko, seikko]}
  hamilton:         {tier: 1, also: [], misspellings: [hamiltion]}
  bulova:           {tier: 1, also: [accutron], misspellings: [bulvoa, bolova]}
  gruen:            {tier: 1, also: [], misspellings: []}

# Live board (python dashboard.py)
dashboard:
  host: 127.0.0.1          # use 0.0.0.0 to open it from your phone on the same wifi
  port: 8000
  refresh_minutes: 10      # how often to re-check bids on tracked watches
  track_min_score: 6       # text-only listings at or above this also go on the board

# Cost assumptions behind "net margin" and "max bid". VERIFY these; they drive every number.
economics:
  target_margin_pct: 30    # max bid is the highest price that still clears this margin at the LOW value estimate
  sell_fee_pct: 15         # marketplace + payment fees where you resell
  ship_in: 15              # what you pay to receive it
  ship_out: 20             # insured shipping to your buyer
  buyer_premium_pct: {ebay: 0, shopgoodwill: 0, propertyroom: 0}   # check each site's current terms
  service_cost: {automatic: 350, manual: 300, quartz: 60, unknown: 250}
  min_comps: 5             # sold results needed before sold data outranks everything else
  # Counterfeit risk, for brands with fake_risk: true.
  # Chance genuine starts at the brand's base rate, then each piece of evidence multiplies the odds:
  #   pass: 5    -> seen 5 times more often on genuine watches than fakes (strong evidence it is genuine)
  #   fail: 0.1  -> seen 10 times more often on fakes (strong evidence it is fake)
  #   unclear or not shown -> no change. Missing evidence does not move the number either way.
  # These weights are expert estimates, not measured data. Tune them as you get watches authenticated.
  # Value = chance x genuine value + (1 - chance) x fake_value. The authentication cost is added to all-in.
  fake_risk:
    # Rough share of genuine pieces among cheap, non-specialist listings (Goodwill, police auctions, vague eBay).
    base_rate: {rolex: 0.25, cartier: 0.3, tudor: 0.35, omega: 0.5, breitling: 0.45, tag heuer: 0.55,
                patek philippe: 0.08, audemars piguet: 0.08, iwc: 0.5}
    max_chance: 0.9      # photos alone never make it certain
    min_chance: 0.01
    checks:              # brands: limits a check to those brands
      movement:         {ask: "Movement shown and the correct signed calibre for this model and era", pass: 5, fail: 0.05}
      caseback:         {ask: "Caseback type, engravings and markings correct for the model (plain on most Rolex)", pass: 1.5, fail: 0.1}
      serial:           {ask: "Serial and reference engraved in the right place and consistent with the model and era", pass: 2.5, fail: 0.15}
      dial_print:       {ask: "Dial print crisp, evenly spaced, correct fonts, no bleed", pass: 1.5, fail: 0.2}
      logo:             {ask: "Logo shape, size and position correct", pass: 1.3, fail: 0.15}
      hands_markers:    {ask: "Hands and markers correct for the reference, lume consistent", pass: 1.2, fail: 0.35}
      case_finish:      {ask: "Case shape, lug proportions, finishing and crown correct", pass: 1.3, fail: 0.25}
      bracelet_clasp:   {ask: "Bracelet, end links and clasp correct for the model, with correct stamps", pass: 1.4, fail: 0.3}
      photos_original:  {ask: "Photos are the seller's own, not stock or lifted from other listings", pass: 1.2, fail: 0.4}
      cyclops:          {brands: [rolex, tudor], ask: "Date magnifier about 2.5x and centred over the date (not_shown if no date)", pass: 1.5, fail: 0.15}
      rehaut:           {brands: [rolex], ask: "Rehaut engraving present and correct on post-2007 models, absent on older ones", pass: 1.5, fail: 0.2}
      secret_signature: {brands: [cartier], ask: "Secret signature in the VII or X on models that have one", pass: 3, fail: 0.3}
      cabochon_crown:   {brands: [cartier], ask: "Crown cabochon present and correct for the model", pass: 1.2, fail: 0.4}
      blued_hands:      {brands: [cartier], ask: "Blued steel sword hands on models that have them", pass: 1.2, fail: 0.4}
      rolex_parts:      {brands: [tudor], ask: "Vintage Tudor: Rolex-signed case, crown or caseback where correct for the era", pass: 2, fail: 0.4}
    # A fixed (buy now) price far below genuine value is a fake pattern. Auction bids are not: they always start low.
    buy_now_price:
      - {below: 0.15, weight: 0.3}   # under 15% of the low genuine value
      - {below: 0.35, weight: 0.6}
    replica_share_threshold: 0.3     # replicas copy real models, so only a large share of replica Lens matches counts
    replica_weight: 0.5
    # Rows checked before per-check scoring existed fall back to the overall concern level.
    fallback_by_concern: {none_visible: 0.6, some: 0.2, cannot_assess: 0.3, high: 0.02}
    fake_value: 25                   # what a fake sells for (often nothing; selling one knowingly is illegal)
    authentication_cost: {rolex: 150, cartier: 120, tudor: 120, omega: 100, breitling: 100, tag heuer: 80,
                          patek philippe: 250, audemars piguet: 250, iwc: 100}
  lens:
    min_prices: 4          # priced Lens matches needed before market data outranks the AI guess
    asking_discount: 0.8   # asking prices run above what watches actually sell for; value = asking x this
    condition_gap: 2.0     # if Lens value is over 2x the AI's as-is high estimate, Lens matched better-condition pieces

